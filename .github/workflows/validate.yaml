name: validate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: "v0.6.7"
  KYVERNO_VERSION: "v1.13.6"
  KUSTOMIZE_VERSION: "5.4.3"
  K8S_VERSION: "1.32.0"

jobs:
  lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .github/linters/.yamllint .

  kubeconform:
    name: Schema Validation (${{ matrix.overlay }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay: [dev, prod]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Cache kubeconform
        id: cache-kubeconform
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/bin/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-linux-amd64

      - name: Install kubeconform
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform

      - name: Build and validate ${{ matrix.overlay }} overlay
        run: |
          kustomize build overlays/${{ matrix.overlay }} | kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version ${{ env.K8S_VERSION }} \
            -schema-location default \
            -output json | tee /tmp/kubeconform-${{ matrix.overlay }}.json

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Kubeconform — \`${{ matrix.overlay }}\`"
            echo '```json'
            cat /tmp/kubeconform-${{ matrix.overlay }}.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  kyverno-test:
    name: Kyverno Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Kyverno CLI
        id: cache-kyverno
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/bin/kyverno
          key: kyverno-${{ env.KYVERNO_VERSION }}-linux-x86_64

      - name: Install Kyverno CLI
        if: steps.cache-kyverno.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin kyverno
          chmod +x /usr/local/bin/kyverno

      - name: Run Kyverno tests
        run: kyverno test kyverno/tests/ --detailed-results 2>&1 | tee /tmp/kyverno-results.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Kyverno Policy Tests"
            echo '```'
            cat /tmp/kyverno-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
