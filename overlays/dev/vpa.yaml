apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nginx-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment
  updatePolicy:
    # Off = recommendation only — no automatic pod restarts.
    # Query after 7+ days to inform prod right-sizing:
    #   kubectl get vpa nginx-vpa -n nginx-dev -o json | jq '.status.recommendation'
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: nginx
        controlledResources: ["cpu", "memory"]
