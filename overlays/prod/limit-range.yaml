apiVersion: v1
kind: LimitRange
metadata:
  name: nginx-limit-range
spec:
  limits:
    - type: Container
      # Defaults applied when a container omits requests/limits.
      # Kyverno enforces explicit limits, but LimitRange acts as a backstop.
      default:
        cpu: "250m"
        memory: "128Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "500m"
        memory: "256Mi"
