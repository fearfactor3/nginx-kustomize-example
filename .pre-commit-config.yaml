default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: detect-aws-credentials
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: f27534437637938638df8c33813df3b8a7d31411 # v9.24.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/cli@20.4.4"
          - "@commitlint/config-conventional@20.4.4"
        args: [--config, .github/linters/.commitlintrc.yaml]

  - repo: local
    hooks:
      - id: kustomize-build
        name: kustomize build
        language: system
        entry: bash -c 'if ! command -v kustomize &>/dev/null; then
            echo "  skip kustomize-build (kustomize not installed)";
            exit 0;
          fi;
          kustomize build overlays/dev && kustomize build overlays/prod'
        pass_filenames: false
        files: \.(yaml|yml)$
