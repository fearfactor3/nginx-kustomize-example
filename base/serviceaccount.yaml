apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: kustomize
# nginx serves static content and requires no Kubernetes API access.
# Disabling auto-mount prevents the API token from being injected into every pod.
automountServiceAccountToken: false
