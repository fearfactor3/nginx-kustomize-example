# MegaLinter configuration
# Docs: https://megalinter.io/latest/configuration/
# Flavor: cupcake — covers YAML, Markdown, GitHub Actions, Gitleaks, Trivy
# without language-runtime overhead (~400MB vs ~2GB for base image).

APPLY_FIXES: none

ENABLE_LINTERS:
  - ACTION_ACTIONLINT       # GitHub Actions syntax validation
  - REPOSITORY_GITLEAKS     # Secret scanning
  - REPOSITORY_TRUFFLEHOG   # Deep secret scanning (complementary to Gitleaks)
  - REPOSITORY_TRIVY        # IaC misconfiguration + CVE scanning
  - SPELL_CSPELL            # Spell check (docs, comments, YAML keys)
  - YAML_YAMLLINT           # YAML style enforcement
  - MARKDOWN_MARKDOWNLINT   # Markdown quality

VALIDATE_ALL_CODEBASE: false
FLAVOR_SUGGESTIONS: false
FILTER_REGEX_EXCLUDE: "(megalinter-reports/)"

REPOSITORY_TRIVY_ARGUMENTS: >-
  --severity CRITICAL,HIGH
  --skip-files overlays/dev/deployment.yaml,overlays/prod/deployment.yaml

YAML_YAMLLINT_CONFIG_FILE: .github/linters/.yamllint
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .github/linters/.markdownlint.json

SHOW_ELAPSED_TIME: true
SARIF_REPORTER: true
FILEIO_REPORTER: false
UPDATED_SOURCES_REPORTER: false
